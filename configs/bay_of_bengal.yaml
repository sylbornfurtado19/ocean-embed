region:
  lat_min: 5.0
  lat_max: 23.0
  lon_min: 80.0
  lon_max: 100.0

dates:
  start: "2023-01-01"
  end: "2023-03-31"

grid:
  resolution: 0.25

model:
  name: "oceanembed_v0_baseline"
  target_depths: [0.0, 5.0, 10.0, 20.0, 30.0, 50.0, 75.0, 100.0, 125.0, 150.0, 200.0, 300.0, 500.0, 700.0, 1000.0]
  input_features:
    - "sst"
    - "sss"
    - "sla"
    - "wind_u"
    - "wind_v"
    - "lat"
    - "lon"
    - "time"
  hidden_dim: 128
  dropout: 0.1

demo_sample:
  n_samples: 2000
  seed: 42

training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 20
  seed: 42

validation:
  strategy: "spatial_holdout"
  holdout_fraction: 0.2
  metrics:
    - "rmse"
    - "mae"
    - "r2"
